<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#252526">
    <meta name="description" content="A browser-based PDF and plan markup tool.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Markup">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Markup</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="toolbar">

        <button id="openPdfBtn">Open PDF</button>

        <button id="newBlankBtn">New Blank</button>

        <input type="file" id="pdfFileInput" accept=".pdf" hidden>

        <button id="openProjectBtn">Open Project</button>

        <input type="file" id="projectFileInput" accept=".markup,.json" hidden>

        <button id="saveProjectBtn">Save Project</button>

        <button id="exportPdfBtn">Export PDF</button>

        <input type="text" id="documentTitleInput" class="document-title-input" value="Untitled" aria-label="Document title" disabled>

        <button id="prevBtn">◀</button>

        <span id="pageDisplay">
            Page 1 / 1
        </span>

        <button id="nextBtn">▶</button>

        <button id="zoomOutBtn">-</button>

        <span id="zoomDisplay">100%</span>

        <button id="zoomInBtn">+</button>

        <button id="fitPageBtn">Fit Page</button>

        <button id="fitWidthBtn">Fit Width</button>

        <button id="actualSizeBtn">100%</button>

        <div class="toolbar-title">
            PDF Markup Tool
        </div>

    </header>

    <main class="viewer-container">

        <aside class="tool-panel">
            <button id="selectBtn" class="tool-btn">
                Select
            </button>

            <div class="tool-group">
                <button id="shapesBtn" class="tool-btn tool-menu-btn" type="button" aria-expanded="false" aria-controls="shapesMenu">
                    Shapes
                </button>

                <div id="shapesMenu" class="tool-menu" hidden>
                    <button id="rectangleBtn" class="tool-btn" type="button">
                        Rectangle
                    </button>

                    <button id="circleBtn" class="tool-btn" type="button">
                        Circle
                    </button>

                    <button id="lineBtn" class="tool-btn" type="button">
                        Line
                    </button>

                    <button id="cloudBtn" class="tool-btn" type="button">
                        Cloud
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <button id="symbolsBtn" class="tool-btn tool-menu-btn" type="button" aria-expanded="false" aria-controls="symbolsMenu">
                    Symbols
                </button>

                <div id="symbolsMenu" class="tool-menu symbol-library" hidden>
                    <button class="tool-btn symbol-btn" type="button" data-symbol="smoke">
                        Smoke
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="heat">
                        Heat
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="pull">
                        Pull
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="horn">
                        Horn
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="strobe">
                        Strobe
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="hornStrobe">
                        Horn/Strobe
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="speakerStrobe">
                        Speaker/Strobe
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="iam">
                        IAM
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="riam">
                        RIAM
                    </button>

                    <button class="tool-btn symbol-btn" type="button" data-symbol="vo">
                        VO
                    </button>
                </div>
            </div>

            <button id="textBtn" class="tool-btn">
                Text
            </button>

            <button id="calloutBtn" class="tool-btn">
                Callout
            </button>

            <button id="deleteBtn" class="tool-btn">
                Delete
            </button>

            <div class="tool-options">
                <label>
                    <input type="checkbox" id="showGridInput">
                    Grid
                </label>

                <label>
                    <input type="checkbox" id="snapGridInput">
                    Snap
                </label>

                <label>
                    <input type="checkbox" id="autoLineInput">
                    Auto Line
                </label>
            </div>

            <div class="properties-panel">
                <div class="properties-title">
                    Properties
                </div>

                <label>
                    Stroke
                    <input type="color" id="strokeColorInput" value="#00ff66">
                </label>

                <label>
                    Fill
                    <input type="color" id="fillColorInput" value="#00ff66">
                </label>

                <label>
                    Fill Opacity
                    <input type="range" id="fillOpacityInput" min="0" max="1" step="0.05" value="0.12">
                </label>

                <label>
                    Line Width
                    <input type="number" id="lineWidthInput" min="1" max="12" value="2">
                </label>

                <label>
                    Text
                    <textarea id="textContentInput" rows="4"></textarea>
                </label>

                <label>
                    Text Color
                    <input type="color" id="textColorInput" value="#111111">
                </label>

                <label>
                    Font Size
                    <input type="number" id="fontSizeInput" min="6" max="72" value="16">
                </label>

                <label>
                    Symbol Label
                    <input type="text" id="symbolLabelInput">
                </label>

                <label>
                    Address
                    <input type="text" id="symbolAddressInput">
                </label>

                <label>
                    Rotation
                    <input type="number" id="rotationInput" min="0" max="359" value="0">
                </label>
            </div>
        </aside>

        <div id="viewer">

            <div id="canvasContainer">

                <canvas id="pdfCanvas"></canvas>

                <canvas id="annotationCanvas"></canvas>

            </div>

        </div>

    </main>

    <footer id="statusBar" class="status-bar">
        Ready
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js");
            });
        }
    </script>

    <script src="./js/app.js"></script>

</body>

</html>
